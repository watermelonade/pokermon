; Export presets: Linux x86_64 (native on the Steam Deck, the primary
; target) and Windows x86_64 (desktop Windows, and the Proton fallback on the
; Deck). Exported by scripts/export.sh and .github/workflows/build.yml; see
; README.md "Building" and docs/STEAM_DECK.md.
;
; - The PCK is NOT embedded: each build is the engine template (byte-identical
;   from build to build) plus a small game.pck. SteamPipe diffs files, so a
;   patch only ships the changed .pck; nothing has to rewrite an executable
;   (no section-offset patching, nothing for virus scanners or code signing
;   to trip on); and a crash report names an unmodified official Godot
;   binary. The cost is two files instead of one, which Steam doesn't mind.
; - tests/ and tools/ are dev-only and excluded (exclude_filter). The
;   README, docs, scripts and steam/ aren't resources and never get packed.
; - Textures: desktop VRAM compression (S3TC/BPTC) only. Everything is drawn
;   from code for now; pixel-art sprites should be imported Lossless with
;   Filter off (the project already defaults canvas textures to Nearest).

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/linux/AFriendInNeed.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

